<div class="module">
<textarea id="text0" oninput="setText()" rows="4"></textarea>
</div>
<select id="fontChange" name="fontChange" onchange="setFont(this.value)">
<option selected="selected" value="0">Formula Condensed - Bold</option>
<option value="1">Editorial New - Thin</option>
<option value="2">Neue World - CondensedRegular</option>
<option value="3">TT Bluescreens - Medium</option>
<option value="4">TT Travels - BlackItalic</option>
<option value="5">Oktah Neue - SemiBold</option>
<option value="6">NotoSans Korean - Black</option>

<div class="coupling1">
<div class="coupling_label"><h3>Size</h3></div>

</div>
</div>
<button class="collapsible" type="button"><h1>STYLE</h1></button>

<div class="coupling1">
<div class="coupling_label"><h3>Fill</h3></div>

</div>

</div>
<div class="coupling1">
<div class="coupling_label"><h3>Stroke</h3></div>
<input id="strokeColor" name="strokeColor" oninput="setStrokeColor(this.value)" type="color" value="#000000"/>
</div>
<div class="coupling1">
<div class="coupling_label"><h3>Weight</h3></div>
<input id="coreSW" max="100" min="1" oninput="setCoreSW(this.value)" type="range" value="50"/>
</div>
</div>
<button class="collapsible" type="button"><h1>BLAST</h1></button>
<div class="content">
<select id="blastType" name="blastType" onchange="setBlastType(this.value)">
<option selected="selected" value="0">Clouds</option>
<option value="1">Spurs</option>
</select>
<div class="coupling1">
<div class="coupling_label"><h3>Detail</h3></div>
<input id="detailFactor" max="100" min="1" oninput="setDetailFactor(this.value)" type="range" value="60"/>
</div>
<div class="coupling1">
<div class="coupling_label"><h3>Strength</h3></div>
<input id="blastFactor" max="100" min="1" oninput="setBlastFactor(this.value)" type="range" value="50"/>
</div>
<div class="coupling1" id="cloudOption1">
<div class="coupling_label"><h3>Ratio</h3></div>
<input id="ratioFactor" max="100" min="1" oninput="setRatioFactor(this.value)" type="range" value="50"/>
</div>
<div class="coupling1b" id="spurOption1">
<label for="messySpur">Messy</label>
<input id="messySpur" name="messySpur" onclick="toggleSpurMessy()" type="checkbox"/>
</div>
<div class="coupling1">
<label for="mousePop">Mouse Pop</label>
<input checked="" id="mousePop" name="mousePop" onclick="toggleMousePop()" type="checkbox"/>
</div>
</div>

<label class="switch">
<input checked="" oninput="hideWidget()" type="checkbox"/>
<span class="slider round"></span>
</label>

<script>
    var coll = document.getElementsByClassName("collapsible");
    var i;
  
    for (i = 0; i < coll.length; i++) {
      coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.display === "block") {
          content.style.display = "none";
        } else {
          content.style.display = "block";
        }
      });
    }
  </script>
