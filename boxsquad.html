<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>STG v.boxSquad</title>
<script src="p5_2.0.5_p5.min.js"></script>
<link href="css2_family3DGoogle2BSans2BFlex3Aopsz2Cslnt2C.css" rel="stylesheet"/>
<link href="css2_family3DIBM2BPlex2BSans3Awght403003B4003.css" rel="stylesheet"/>
<script src="boxSquad_script/sketch_boxSquad.js" type="text/javascript"></script>
<script src="boxSquad_script/animators.js" type="text/javascript"></script>
<script src="boxSquad_script/class_boxSquad.js" type="text/javascript"></script>
<link href="boxSquad_script/style.css" rel="stylesheet"/>
</head>
<body>
<!-- FLOATING PANEL -->

<script>
  function updateFill(sl) {
    const min = parseFloat(sl.min), max = parseFloat(sl.max), val = parseFloat(sl.value);
    sl.style.setProperty('--fill', ((val - min) / (max - min) * 100) + '%');
  }

  // ── Flip-toggle switches ──
  document.getElementById('debug-toggle').addEventListener('change', e => {
    debugStroke = e.target.checked;
  });
  document.getElementById('twerk-toggle').addEventListener('change', e => {
    twerkMode = e.target.checked;
  });
  document.getElementById('bw-toggle').addEventListener('change', e => {
    if (typeof setBWMode === 'function') setBWMode(e.target.checked);
  });
  document.getElementById('checker-toggle').addEventListener('change', e => {
    checkerMode = e.target.checked;
  });

  // ── Action buttons ──
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (typeof resetGrid === 'function') resetGrid();
  });
  document.getElementById('reroll-btn').addEventListener('click', () => {
    if (typeof rerollGrid === 'function') rerollGrid();
  });

  // ── Grid dimension steppers ──
  document.getElementById('cols-minus').addEventListener('click', () => { if (typeof adjustCols === 'function') adjustCols(-1); });
  document.getElementById('cols-plus') .addEventListener('click', () => { if (typeof adjustCols === 'function') adjustCols(+1); });
  document.getElementById('rows-minus').addEventListener('click', () => { if (typeof adjustRows === 'function') adjustRows(-1); });
  document.getElementById('rows-plus') .addEventListener('click', () => { if (typeof adjustRows === 'function') adjustRows(+1); });

  // ── Minimize ──
  document.getElementById('minimize-btn').addEventListener('click', e => {
    e.stopPropagation();
    const body = document.getElementById('panel-body');
    const btn  = document.getElementById('minimize-btn');
    const collapsed = body.classList.toggle('collapsed');
    btn.innerHTML = collapsed
      ? `<svg width="10" height="7" viewBox="0 0 10 7" fill="none"><path d="M1 6l4-4 4 4" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : `<svg width="10" height="2" viewBox="0 0 10 2" fill="none"><rect width="10" height="2" rx="1" fill="rgba(255,255,255,0.5)"/></svg>`;
  });

  // ── Panel drag ──
  (function() {
    const panel  = document.getElementById('panel');
    const header = document.getElementById('panel-header');
    let dragging = false, ox = 0, oy = 0;
    header.addEventListener('mousedown', e => {
      if (window.innerWidth <= 600) return;   // bottom-sheet on mobile — no dragging
      dragging = true;
      const r = panel.getBoundingClientRect();
      ox = e.clientX - r.left;
      oy = e.clientY - r.top;
      panel.style.transition = 'none';
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      panel.style.right = 'auto';
      panel.style.left = (e.clientX - ox) + 'px';
      panel.style.top  = (e.clientY - oy) + 'px';
    });
    document.addEventListener('mouseup', () => dragging = false);
  })();
</script>
</body>
</html>
