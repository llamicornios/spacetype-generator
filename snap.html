<button class="collapsible" type="button"><h1>TEXT INPUT</h1></button>
<div class="content">
<div class="module">
<textarea id="textArea" oninput="setText()" rows="4"></textarea>
<div class="textureEdit">
<select id="fontChange" name="fontChange" onchange="setFont(this.value)">
<option selected="selected" value="0">Inter - Medium</option>
<option value="1">Inter - Black</option>
<option value="2">Apoc_LC - Regluar</option>
<option value="3">IBM_Plex_Mono - Bold Italic</option>
<option value="4">Space Mono - Regular</option>
<option value="5">Space Grotesk - Bold</option>
</select>
<div class="coupling1">
<div class="coupling_label"><h3>Size</h3></div>
<input id="fontSize" max="200" min="20" oninput="setFontSize(this.value)" type="range" value="70"/>
</div>
<div class="coupling1">
<input id="bColor" name="bColor" oninput="setBkgdColor(this.value)" type="color" value="#000000"/>
<input id="fColor" name="fColor" oninput="setForeColor(this.value)" type="color" value="#ffffff"/>
</div>
</div>
</div>
</div>
<button class="collapsible" type="button"><h1>SAVE</h1></button>
<div class="content">
<div class="coupling2">
<div class="couplingEntry">
<input checked="" id="window" name="saveSize" onclick="sizeSaveChange(this.value)" type="radio" value="0"/>
<label for="window">Window Size</label>
</div>
<div class="couplingEntry">
<input id="vert" name="saveSize" onclick="sizeSaveChange(this.value)" type="radio" value="1"/>
<label for="vert">Vertical, 9:16</label>
</div>
<div class="couplingEntry">
<input id="squa" name="saveSize" onclick="sizeSaveChange(this.value)" type="radio" value="2"/>
<label for="squa">Square, 1:1</label>
</div>
</div>
<div class="module">
<button class="saveButton" onclick="runSave()" type="button">SAVE LOOP</button>
</div>

<p>RECORDING IN PROCESS <br/>(preview not accurate)</p>
</div>
</div>
</div>

<div>
<label class="switch">
<input checked="" oninput="hideWidget()" type="checkbox"/>
<span class="slider round"></span>
</label>

<script>
    var coll = document.getElementsByClassName("collapsible");
    var i;
  
    for (i = 0; i < coll.length; i++) {
      coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.display === "block") {
          content.style.display = "none";
        } else {
          content.style.display = "block";
        }
      });
    }
  </script>
